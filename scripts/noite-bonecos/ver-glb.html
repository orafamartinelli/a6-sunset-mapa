<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#556}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script></head><body>
<script type="module">
// Conferência de forma 3D: mostra o .glb de frente, 3/4 e perfil lado a lado. ?f=arquivo.glb
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const f = new URLSearchParams(location.search).get('f');
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1200, 500); document.body.appendChild(r.domElement);
const cena = new THREE.Scene(); cena.background = new THREE.Color(0x556070);
cena.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.6));
const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 3, 4); cena.add(d);
const cam = new THREE.OrthographicCamera(-3.6, 3.6, 1.5, -1.5, 0.1, 50); cam.position.set(0, 0, 10);
new GLTFLoader().load(f, g => {
  const base = g.scene; const box = new THREE.Box3().setFromObject(base);
  const tam = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const esc = 2.6 / Math.max(tam.x, tam.y, tam.z);
  base.traverse(o => { if (o.isMesh) { o.geometry.deleteAttribute("color"); o.geometry.computeVertexNormals(); } if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ color: 0xd9c7b0, roughness: 0.8, side: THREE.DoubleSide }); });
  [0, -Math.PI / 4, -Math.PI / 2].forEach((ry, i) => {
    const k = base.clone(); const p = new THREE.Group(); k.position.sub(c); p.add(k);
    p.scale.setScalar(esc); p.rotation.y = ry; p.position.x = (i - 1) * 2.4; cena.add(p);
  });
  r.render(cena, cam); document.title = 'pronto ' + tam.x.toFixed(2) + ' ' + tam.y.toFixed(2) + ' ' + tam.z.toFixed(2);
});
</script></body></html>
